<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f0f4f8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="#1e293b"/>
  <!-- UI Window Mockup -->
  <rect x="30" y="30" width="540" height="340" rx="12" fill="url(#cardGrad)" filter="url(#shadow)"/>
  <circle cx="55" cy="52" r="6" fill="#E74C3C"/>
  <circle cx="75" cy="52" r="6" fill="#F39C12"/>
  <circle cx="95" cy="52" r="6" fill="#2ECC71"/>
  <rect x="120" y="44" width="220" height="16" rx="8" fill="#e2e8f0"/>
  <!-- Code/Chart elements inside mockup -->
  <rect x="55" y="85" width="160" height="90" rx="8" fill="#3498DB" fill-opacity="0.15"/>
  <rect x="70" y="105" width="80" height="12" rx="4" fill="#3498DB"/>
  <rect x="70" y="125" width="110" height="8" rx="4" fill="#94a3b8"/>
  <rect x="70" y="140" width="60" height="8" rx="4" fill="#94a3b8"/>

  <rect x="235" y="85" width="310" height="90" rx="8" fill="#2C3E50" fill-opacity="0.08"/>
  <rect x="250" y="105" width="140" height="12" rx="4" fill="#2C3E50"/>
  <rect x="250" y="125" width="220" height="8" rx="4" fill="#64748b"/>
  <rect x="250" y="140" width="180" height="8" rx="4" fill="#64748b"/>

  <!-- Analytics bars -->
  <rect x="55" y="195" width="490" height="150" rx="8" fill="#ffffff"/>
  <rect x="90" y="290" width="35" height="40" rx="4" fill="#3498DB" fill-opacity="0.6"/>
  <rect x="150" y="260" width="35" height="70" rx="4" fill="#3498DB" fill-opacity="0.75"/>
  <rect x="210" y="230" width="35" height="100" rx="4" fill="#3498DB"/>
  <rect x="270" y="210" width="35" height="120" rx="4" fill="#667eea"/>
  <rect x="330" y="240" width="35" height="90" rx="4" fill="#764ba2"/>
  <rect x="390" y="220" width="35" height="110" rx="4" fill="#E74C3C" fill-opacity="0.85"/>
